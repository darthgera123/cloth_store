name: Deploy Game Night to GitHub Pages

# Pages for this repository is served from the gh-pages branch (the storefront
# lives there). The game is built here and published under /game/ so both
# coexist at https://darthgera123.github.io/cloth_store/.

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-night-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Build the game
        working-directory: game
        env:
          BASE_PATH: /cloth_store/game/
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/site
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/site

          rm -rf /tmp/site/game
          mkdir -p /tmp/site/game
          cp -r game/dist/. /tmp/site/game/
          touch /tmp/site/.nojekyll

          cd /tmp/site
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Deploy Game Night ${GITHUB_SHA::7}"
          git push origin gh-pages
