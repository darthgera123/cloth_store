<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game Night — Host</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap"
    />
    <link rel="stylesheet" href="static/tokens.css" />
    <link rel="stylesheet" href="static/components.css" />
    <link rel="stylesheet" href="static/host.css" />
  </head>
  <body class="host">
    <svg class="sprite" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="mark-strike" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M5 5l14 14M19 5L5 19" stroke-width="1.8" />
        </symbol>
      </defs>
    </svg>

    <header class="hostbar">
      <div class="brand">
        <span class="brand__script">Game Night</span>
        <span class="brand__tag">Host</span>
      </div>
      <p class="hint">
        Audience display: open <code>index.html</code> on the projector screen
      </p>
    </header>

    <main class="hostmain">
      <section class="card">
        <div class="card__head">
          <h2>Family Feud</h2>
          <span class="meta" data-round-label>Question 1 of 6</span>
        </div>

        <p class="host-q" data-question></p>
        <div class="answerlist" data-answers></div>

        <div class="card__foot">
          <button class="hbtn" type="button" data-action="prev-q">◀ Prev</button>
          <button class="hbtn" type="button" data-action="next-q">Next ▶</button>
          <button class="hbtn" type="button" data-action="reveal-all">Reveal all</button>
          <button class="hbtn" type="button" data-action="hide-all">Hide all</button>
          <button class="hbtn" type="button" data-action="reset-q">Reset round</button>
        </div>
      </section>

      <aside class="hostside">
        <section class="card">
          <div class="card__head">
            <h2>Teams</h2>
            <span class="meta">Score &amp; strikes</span>
          </div>
          <div data-teams></div>
        </section>

        <section class="card">
          <div class="card__head">
            <h2>Audience Screen</h2>
            <span class="meta">Now showing</span>
          </div>
          <div class="seg" data-screens>
            <button type="button" data-screen-set="welcome">Welcome</button>
            <button type="button" data-screen-set="games">Games</button>
            <button type="button" data-screen-set="feud">Board</button>
          </div>
          <div class="card__foot">
            <button class="hbtn hbtn--danger" type="button" data-action="reset-game">
              Reset whole game
            </button>
          </div>
        </section>
      </aside>
    </main>

    <footer class="hostfoot">
      Keys: <b>R</b> reveal all · <b>N</b> next question · <b>1</b>/<b>2</b> active team ·
      <b>S</b> strike
    </footer>

    <script type="module" src="static/host.js"></script>
  </body>
</html>
