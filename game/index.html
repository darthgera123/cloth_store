<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game Night</title>
    <meta name="description" content="Game Night — an evening of friendly competition." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap"
    />
    <link rel="stylesheet" href="static/tokens.css" />
    <link rel="stylesheet" href="static/components.css" />
    <link rel="stylesheet" href="static/screens.css" />
  </head>
  <body class="audience">
    <svg class="sprite" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="corner-flourish" viewBox="0 0 72 72" fill="none" stroke="currentColor">
          <path d="M4 68V28Q4 4 28 4h40" stroke-width="1.1" />
          <path d="M13 68V34Q13 13 34 13h38" stroke-width="1" opacity="0.45" />
          <path d="M26 20q12-7 21 3" stroke-width="1" opacity="0.6" />
          <path d="M20 30q7 7 1 14" stroke-width="1" opacity="0.45" />
          <circle cx="13" cy="13" r="1.5" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="mark-lotus" viewBox="0 0 44 24" fill="none" stroke="currentColor">
          <path d="M22 4l6 8-6 8-6-8 6-8Z" stroke-width="1" />
          <path d="M11 12q6-6 10 0-4 6-10 0Z" stroke-width="1" opacity="0.65" />
          <path d="M33 12q-6-6-10 0 4 6 10 0Z" stroke-width="1" opacity="0.65" />
          <circle cx="22" cy="12" r="1.3" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="mark-strike" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M5 5l14 14M19 5L5 19" stroke-width="1.7" />
        </symbol>
      </defs>
    </svg>

    <div class="ornament-layer" aria-hidden="true">
      <div class="mandala mandala--tl" data-mandala data-rotation="0"></div>
      <div class="mandala mandala--br" data-mandala data-rotation="18"></div>
    </div>

    <main class="stage">
      <section class="screen" data-screen="welcome">
        <div class="panel panel--invite">
          <span class="panel__frame" aria-hidden="true"></span>
          <svg class="corner corner--tl" aria-hidden="true"><use href="#corner-flourish" /></svg>
          <svg class="corner corner--tr" aria-hidden="true"><use href="#corner-flourish" /></svg>
          <svg class="corner corner--bl" aria-hidden="true"><use href="#corner-flourish" /></svg>
          <svg class="corner corner--br" aria-hidden="true"><use href="#corner-flourish" /></svg>

          <div class="welcome__inner">
            <h1 class="title-script">Game Night</h1>
            <div class="rule" aria-hidden="true">
              <span class="rule__line"></span>
              <svg class="rule__mark"><use href="#mark-lotus" /></svg>
              <span class="rule__line"></span>
            </div>
            <p class="lede" data-subtitle>
              Two Families. One Celebration. A Little Friendly Competition.
            </p>
            <button class="btn btn--primary" type="button" data-action="open-games">
              Let the Games Begin
            </button>
          </div>
        </div>
      </section>

      <section class="screen" data-screen="games">
        <div class="panel panel--select">
          <span class="panel__frame" aria-hidden="true"></span>
          <svg class="corner corner--tl" aria-hidden="true"><use href="#corner-flourish" /></svg>
          <svg class="corner corner--tr" aria-hidden="true"><use href="#corner-flourish" /></svg>
          <svg class="corner corner--bl" aria-hidden="true"><use href="#corner-flourish" /></svg>
          <svg class="corner corner--br" aria-hidden="true"><use href="#corner-flourish" /></svg>

          <div class="select__head">
            <p class="kicker">The Evening's Programme</p>
            <h2 class="heading-serif">Choose Your Game</h2>
          </div>

          <div class="tile-grid">
            <button class="tile" type="button" data-game="family-feud">
              <span class="tile__num">I</span>
              <span class="tile__name">Family Feud</span>
            </button>
            <button class="tile" type="button" data-game="herd-mentality" disabled>
              <span class="tile__tag">Soon</span>
              <span class="tile__num">II</span>
              <span class="tile__name">Herd Mentality</span>
            </button>
            <button class="tile" type="button" data-game="most-likely" disabled>
              <span class="tile__tag">Soon</span>
              <span class="tile__num">III</span>
              <span class="tile__name">Who's Most Likely?</span>
            </button>
            <button class="tile" type="button" data-game="price-is-right" disabled>
              <span class="tile__tag">Soon</span>
              <span class="tile__num">IV</span>
              <span class="tile__name">The Price Is Right</span>
            </button>
          </div>
        </div>
      </section>

      <section class="screen" data-screen="feud">
        <div class="panel board">
          <span class="panel__frame" aria-hidden="true"></span>

          <div class="feud">
            <div class="feud__top">
              <div class="team" data-team="0">
                <span class="team__active">On the board</span>
                <span class="team__name" data-name></span>
                <span class="team__score" data-score>0</span>
                <span class="team__strikes" data-strikes></span>
              </div>

              <div class="round">
                <span class="round__label">Question</span>
                <span class="round__num" data-round>1</span>
                <span class="round__label" data-total>of 6</span>
              </div>

              <div class="team team--right" data-team="1">
                <span class="team__active">On the board</span>
                <span class="team__name" data-name></span>
                <span class="team__score" data-score>0</span>
                <span class="team__strikes" data-strikes></span>
              </div>
            </div>

            <h2 class="question" data-question></h2>
            <ol class="answers" data-answers></ol>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="static/audience.js"></script>
  </body>
</html>
